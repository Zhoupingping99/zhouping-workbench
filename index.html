<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周萍工作台 · 婚纱摄影门市销售</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="周萍工作台">
<meta name="theme-color" content="#d63384">
<style>
/* ========== 基础重置 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #e879a6;
  --primary-dark: #d63384;
  --primary-light: #fce4ec;
  --bg: #faf5f8;
  --card: #ffffff;
  --text: #2d1b2e;
  --text-light: #6c5b6b;
  --border: #f0d9e2;
  --success: #28a745;
  --warning: #ffc107;
  --danger: #dc3545;
  --info: #17a2b8;
  --shadow: 0 2px 12px rgba(214, 51, 132, 0.08);
  --shadow-hover: 0 6px 24px rgba(214, 51, 132, 0.15);
  --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Heiti SC', 'STHeiti', 'SimHei', 'Arial Unicode MS', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
}
.emoji, .hot-video .video-bg, .recipe-card .recipe-img, .nav-icon, .copy-tag, .overview-card .icon {
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "EmojiOne Color", "Twemoji Mozilla", sans-serif;
  font-style: normal;
}


/* ========== 顶部导航 ========== */
.topbar {
  background: linear-gradient(135deg, #d63384 0%, #e879a6 50%, #f4a4c0 100%);
  color: #fff;
  padding: 16px 24px;
  box-shadow: 0 2px 16px rgba(214, 51, 132, 0.2);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}
.topbar-title { display: flex; align-items: center; gap: 12px; }
.topbar-title h1 { font-size: 22px; font-weight: 700; }
.topbar-title .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
.topbar-title .avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700;
  border: 2px solid rgba(255,255,255,0.4);
}
.topbar-right { display: flex; align-items: center; gap: 20px; font-size: 13px; }
.topbar-right .date-block { text-align: right; }
.topbar-right .date-block .big { font-size: 16px; font-weight: 600; }
.topbar-right .date-block .small { font-size: 11px; opacity: 0.85; }

/* ========== 布局：左侧导航 + 右侧内容 ========== */
.layout {
  display: flex;
  max-width: 1400px;
  margin: 0 auto;
  min-height: calc(100vh - 80px);
}

/* ========== 左侧竖向导航 ========== */
.nav-sidebar {
  width: 180px;
  flex-shrink: 0;
  background: #fff;
  border-right: 1px solid var(--border);
  padding: 16px 0;
  position: sticky;
  top: 80px;
  height: calc(100vh - 80px);
  overflow-y: auto;
  box-shadow: 2px 0 8px rgba(0,0,0,0.03);
}
.nav-sidebar .nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 20px;
  cursor: pointer;
  border: none;
  background: none;
  font-size: 14px;
  color: var(--text-light);
  border-left: 3px solid transparent;
  transition: all 0.2s;
  width: 100%;
  text-align: left;
  font-weight: 500;
  position: relative;
}
.nav-sidebar .nav-item:hover { background: var(--primary-light); color: var(--primary-dark); }
.nav-sidebar .nav-item.active { color: var(--primary-dark); border-left-color: var(--primary-dark); background: var(--primary-light); font-weight: 600; }
.nav-sidebar .nav-item .nav-icon { font-size: 18px; flex-shrink: 0; }
.nav-sidebar .nav-item .nav-text { flex: 1; white-space: nowrap; }
.nav-sidebar .nav-item .badge {
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

/* ========== 主内容区 ========== */
.main { flex: 1; padding: 24px; min-width: 0; }
.tab-content { display: none; animation: fadeIn 0.3s; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ========== 今日概览 ========== */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.overview-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 16px;
  transition: all 0.2s;
}
.overview-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.overview-card .icon {
  width: 52px; height: 52px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.overview-card .icon.pink { background: var(--primary-light); color: var(--primary-dark); }
.overview-card .icon.green { background: #d4edda; color: #155724; }
.overview-card .icon.yellow { background: #fff3cd; color: #856404; }
.overview-card .icon.blue { background: #d1ecf1; color: #0c5460; }
.overview-card .icon.purple { background: #e2d5f1; color: #6f42c1; }
.overview-card .info .label { font-size: 12px; color: var(--text-light); }
.overview-card .info .value { font-size: 22px; font-weight: 700; color: var(--text); margin-top: 2px; }
.overview-card .info .extra { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* ========== 卡片通用 ========== */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--border);
}
.card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-title .emoji { font-size: 18px; }
.card-actions { display: flex; gap: 8px; }

/* ========== 按钮 ========== */
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 11px; }

/* ========== 文案卡片 ========== */
.copy-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
.copy-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  background: #fff;
  transition: all 0.2s;
  position: relative;
}
.copy-item:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.copy-item .copy-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 10px;
}
.copy-item .copy-tag.morning { background: #fff3cd; color: #856404; }
.copy-item .copy-tag.online { background: #d1ecf1; color: #0c5460; }
.copy-item .copy-tag.store { background: #d4edda; color: #155724; }
.copy-item .copy-tag.referral { background: #e2d5f1; color: #6f42c1; }
.copy-item .copy-tag.review { background: #fce4ec; color: #d63384; }
.copy-item .copy-content { font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
.copy-item .copy-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
.copy-item .copy-footer .tip { font-size: 11px; color: var(--text-light); }
.copy-item .copy-btn { font-size: 11px; }

/* ========== 热点卡片 ========== */
.hot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.hot-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: all 0.2s;
  background: #fff;
}
.hot-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.hot-card .hot-video {
  width: 100%; aspect-ratio: 9/16; max-height: 280px;
  position: relative;
  display: flex; align-items: flex-end; justify-content: center;
  overflow: hidden;
}
.hot-card .hot-video .video-bg {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 56px;
}
.hot-card .hot-video .video-gradient {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 25%, transparent 60%, rgba(0,0,0,0.7) 100%);
}
.hot-card .hot-video .video-top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 8px 12px;
  display: flex; justify-content: space-between; align-items: center;
  color: #fff; font-size: 11px;
}
.hot-card .hot-video .video-top .rank-badge {
  background: rgba(214, 51, 132, 0.9);
  padding: 2px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.hot-card .hot-video .video-top .hot-label { font-size: 10px; opacity: 0.9; }
.hot-card .hot-video .video-bottom {
  position: relative; z-index: 2;
  padding: 12px;
  color: #fff;
  width: 100%;
}
.hot-card .hot-video .video-account {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; margin-bottom: 6px;
}
.hot-card .hot-video .video-account .acc-emoji {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.hot-card .hot-video .video-title {
  font-size: 13px; font-weight: 600; line-height: 1.4;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}
.hot-card .hot-video .video-stats {
  display: flex; gap: 14px; margin-top: 8px;
  font-size: 11px; opacity: 0.9;
}
.hot-card .hot-video .video-screenshot {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  font-size: 11px; color: rgba(255,255,255,0.85);
  text-align: center; max-width: 80%;
  background: rgba(0,0,0,0.35);
  padding: 6px 10px; border-radius: 6px;
  line-height: 1.5;
}
.hot-card .hot-body { padding: 14px; }
.hot-card .hot-desc { font-size: 12px; color: var(--text-light); line-height: 1.6; margin-bottom: 10px; }
.hot-card .hot-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.hot-card .hot-tags .tag { font-size: 10px; padding: 2px 8px; background: var(--primary-light); color: var(--primary-dark); border-radius: 8px; }

/* ========== 待办列表 ========== */
.todo-list { display: flex; flex-direction: column; gap: 8px; }
.todo-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  transition: all 0.2s;
}
.todo-item:hover { border-color: var(--primary); }
.todo-item.done { opacity: 0.5; }
.todo-item.done .todo-text { text-decoration: line-through; }
.todo-checkbox {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.todo-checkbox.checked { background: var(--success); border-color: var(--success); color: #fff; }
.todo-checkbox.checked::after { content: '✓'; font-size: 14px; }
.todo-text { flex: 1; font-size: 14px; }
.todo-time { font-size: 12px; color: var(--text-light); }
.todo-priority { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.todo-priority.high { background: #f8d7da; color: #721c24; }
.todo-priority.mid { background: #fff3cd; color: #856404; }
.todo-priority.low { background: #d1ecf1; color: #0c5460; }

/* ========== 菜谱卡片 ========== */
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.recipe-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  transition: all 0.2s;
  cursor: pointer;
}
.recipe-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.recipe-card .recipe-img {
  height: 120px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.recipe-card .recipe-body { padding: 12px; }
.recipe-card .recipe-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.recipe-card .recipe-tags { display: flex; gap: 4px; margin-bottom: 6px; }
.recipe-card .recipe-tags .tag { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: var(--bg); color: var(--text-light); }
.recipe-card .recipe-time { font-size: 11px; color: var(--text-light); }
.recipe-detail { display: none; margin-top: 10px; font-size: 12px; color: var(--text-light); line-height: 1.8; }
.recipe-card.expanded .recipe-detail { display: block; }
.recipe-card.expanded .recipe-toggle::after { content: '收起 ▲'; }
.recipe-toggle { font-size: 11px; color: var(--primary); margin-top: 6px; cursor: pointer; }
.recipe-toggle::after { content: '查看做法 ▼'; }

/* ========== 回访列表 ========== */
.callback-table { width: 100%; border-collapse: collapse; }
.callback-table th { text-align: left; padding: 10px 12px; background: var(--bg); font-size: 12px; color: var(--text-light); border-bottom: 2px solid var(--border); }
.callback-table td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.callback-table tr:hover { background: var(--primary-light); }
.status-pill { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.status-pill.冷 { background: #d1ecf1; color: #0c5460; }
.status-pill.温 { background: #fff3cd; color: #856404; }
.status-pill.热 { background: #f8d7da; color: #721c24; }
.status-pill.已定 { background: #d4edda; color: #155724; }

/* ========== 运动打卡 ========== */
.run-card {
  display: flex; align-items: center; gap: 24px;
  padding: 24px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.run-card .run-icon { font-size: 48px; }
.run-card .run-info { flex: 1; }
.run-card .run-info h3 { font-size: 18px; margin-bottom: 4px; }
.run-card .run-info p { font-size: 13px; opacity: 0.85; }
.run-progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 12px; overflow: hidden; }
.run-progress-fill { height: 100%; background: #fff; border-radius: 4px; transition: width 0.5s; }
.run-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 12px; }
.run-stat { text-align: center; }
.run-stat .val { font-size: 20px; font-weight: 700; }
.run-stat .lbl { font-size: 11px; opacity: 0.8; }

/* ========== 营销活动 ========== */
.market-list { display: flex; flex-direction: column; gap: 16px; }
.market-item { border-left: 4px solid var(--primary); padding: 16px 20px; background: #fff; border-radius: 0 10px 10px 0; box-shadow: var(--shadow); }
.market-item .market-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.market-item .market-desc { font-size: 13px; color: var(--text-light); line-height: 1.7; }
.market-item .market-tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ========== 提示框 ========== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #333; color: #fff; padding: 10px 24px; border-radius: 8px;
  font-size: 13px; z-index: 9999; transition: all 0.3s; opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ========== 抖音号管理 ========== */
.account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-bottom: 20px; }
.account-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; background: #fff; }
.account-card .acc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.account-card .acc-avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.account-card .acc-avatar.vlog { background: #fff3cd; }
.account-card .acc-avatar.product { background: #fce4ec; }
.account-card .acc-avatar.bts { background: #d1ecf1; }
.account-card .acc-avatar.life { background: #e2d5f1; }
.account-card .acc-name { font-size: 14px; font-weight: 600; }
.account-card .acc-type { font-size: 11px; color: var(--text-light); }
.account-card .acc-stats { display: flex; gap: 16px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.account-card .acc-stat .num { font-size: 16px; font-weight: 700; }
.account-card .acc-stat .lbl { font-size: 10px; color: var(--text-light); }
.account-card .acc-suggest { font-size: 12px; color: var(--text-light); line-height: 1.7; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  .topbar { padding: 14px 12px; }
  .topbar-title h1 { font-size: 17px; }
  .topbar-title .subtitle { font-size: 11px; }
  .topbar-title .avatar { width: 38px; height: 38px; font-size: 16px; }
  .topbar-right .date-block .big { font-size: 14px; }
  /* 手机端：保持左侧竖排导航，缩小宽度 */
  .layout { flex-direction: row; }
  .nav-sidebar {
    width: 64px;
    min-width: 64px;
    height: calc(100vh - 68px);
    top: 68px;
    padding: 8px 0;
  }
  .nav-sidebar .nav-item {
    flex-direction: column;
    gap: 2px;
    padding: 10px 4px;
    font-size: 9px;
    text-align: center;
    border-left: none;
    border-bottom: 2px solid transparent;
  }
  .nav-sidebar .nav-item.active {
    border-left: none;
    border-bottom: 2px solid var(--primary-dark);
  }
  .nav-sidebar .nav-item .nav-icon { font-size: 18px; }
  .nav-sidebar .nav-item .nav-text { font-size: 9px; line-height: 1.1; }
  .nav-sidebar .nav-item .badge { font-size: 8px; padding: 0 4px; min-width: 14px; }
  .main { padding: 10px; }
  .overview-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .overview-card { padding: 12px; gap: 10px; }
  .overview-card .icon { width: 40px; height: 40px; font-size: 18px; }
  .overview-card .info .value { font-size: 18px; }
  .hot-grid { grid-template-columns: 1fr; }
  .recipe-grid, .account-grid { grid-template-columns: 1fr; }
  .run-card { flex-direction: column; text-align: center; padding: 16px; gap: 16px; }
  .run-stats { grid-template-columns: 1fr 1fr; }
  .callback-table { font-size: 10px; }
  .callback-table th, .callback-table td { padding: 5px 3px; }
  .card { padding: 14px; }
  .card-title { font-size: 14px; }
}

/* ========== 每日记账 ========== */
.budget-today-card {
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  color: #fff;
  box-shadow: var(--shadow);
}
.budget-today-card.ok { background: linear-gradient(135deg, #28a745 0%, #5fc77a 100%); }
.budget-today-card.over { background: linear-gradient(135deg, #dc3545 0%, #f0857a 100%); }
.budget-today-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.budget-today-label { font-size: 12px; opacity: 0.9; }
.budget-today-amount { font-size: 28px; font-weight: 700; margin-top: 4px; }
.budget-today-remain { font-size: 32px; font-weight: 700; margin-top: 4px; }
.text-over { color: #fff; }
.text-ok { color: #fff; }
.budget-progress-bar { width: 100%; height: 10px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
.budget-progress-fill { height: 100%; border-radius: 5px; transition: width 0.5s; }
.budget-progress-fill.ok { background: #fff; }
.budget-progress-fill.over { background: #fff; }
.budget-today-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.budget-stat { text-align: center; }

function getNotes() {
  try { return JSON.parse(localStorage.getItem('zhouping_notes') || '[]'); } catch(e) { return []; }
}
function saveNotes(notes) { localStorage.setItem('zhouping_notes', JSON.stringify(notes)); }
function addNote() {
  const input = document.getElementById('note-input');
  const tagInput = document.getElementById('note-tag');
  const content = input.value.trim();
  if (!content) { showToast('?? 内容不能为空'); return; }
  const notes = getNotes();
  const now = new Date();
  notes.unshift({ content, tag: tagInput.value.trim() || '备忘', time: `${now.getMonth()+1}/${now.getDate()} ${now.toTimeString().slice(0,5)}` });
  saveNotes(notes);
  showToast('? 备忘已保存');
  render();
}
function deleteNote(index) {
  const notes = getNotes();
  notes.splice(index, 1);
  saveNotes(notes);
  showToast('?? 已删除');
  render();
}
function copyNote(index) {
  const notes = getNotes();
  const content = notes[index].content;
  navigator.clipboard.writeText(content).then(() => showToast('? 已复制')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = content;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('? 已复制');
  });
}
function escapeHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- 渲染每日记账 ---------- */
const DAILY_BUDGET = 100;
function getBudgetData() { try { return JSON.parse(localStorage.getItem('zhouping_budget') || '{}'); } catch(e) { return {}; } }
function saveBudgetData(data) { localStorage.setItem('zhouping_budget', JSON.stringify(data)); }
function getTodayStr() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
function formatDateCN(dateStr) { const p = dateStr.split('-'); return `${p[1]}/${p[2]}`; }

function renderBudget() {
  const data = getBudgetData();
  const today = getTodayStr();
  function getYesterdayStr(d) {
    const date = new Date(d + 'T00:00:00');
    date.setDate(date.getDate() - 1);
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  }
  const yesterday = getYesterdayStr(today);
  const yesterdayRecords = data[yesterday] || [];
  const yesterdayTotal = yesterdayRecords.reduce((s, r) => s + r.amount, 0);
  const yesterdayRemain = DAILY_BUDGET - yesterdayTotal;
  const todayBudget = DAILY_BUDGET + yesterdayRemain;
  const todayRecords = data[today] || [];
  const todayTotal = todayRecords.reduce((s, r) => s + r.amount, 0);
  const todayRemain = todayBudget - todayTotal;
  const allDates = Object.keys(data).sort().reverse();
  const historyDates = allDates.filter(d => d !== today).slice(0, 7);
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0,0,0,0);
  let weekTotal = 0;
  allDates.forEach(d => { const dateObj = new Date(d); if (dateObj >= weekStart) { weekTotal += (data[d]||[]).reduce((s,r)=>s+r.amount,0); } });
  let monthTotal = 0;
  allDates.forEach(d => { if (d.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`)) { monthTotal += (data[d]||[]).reduce((s,r)=>s+r.amount,0); } });
  const isOver = todayTotal > todayBudget;
  const hasYesterday = yesterdayRecords.length > 0;

  return `
    <div class="budget-today-card ${isOver ? 'over' : 'ok'}">
      <div class="budget-today-top">
        <div>
          <div class="budget-today-label">? ${today.replace(/-/g,'/')} 今日预算</div>
          <div class="budget-today-amount">?${todayBudget.toFixed(1)}</div>
          ${hasYesterday ? `<div style="font-size:11px;opacity:0.85;margin-top:4px">${yesterdayRemain >= 0 ? `? 含昨日结余 ?${yesterdayRemain.toFixed(1)}` : `?? 含昨日超支 ?${Math.abs(yesterdayRemain).toFixed(1)}`}</div>` : ''}
        </div>
        <div style="text-align:right">
          <div class="budget-today-label">${isOver ? '?? 已超支' : '? 还能花'}</div>
          <div class="budget-today-remain ${isOver ? 'text-over' : 'text-ok'}">${isOver ? '-' : ''}?${Math.abs(todayRemain).toFixed(1)}</div>
        </div>
      </div>
      <div class="budget-progress-bar">
        <div class="budget-progress-fill ${isOver ? 'over' : 'ok'}" style="width:${Math.min(100, (todayTotal/todayBudget)*100)}%"></div>
      </div>
      <div class="budget-today-stats">
        <div class="budget-stat"><div class="val">?${todayTotal.toFixed(1)}</div><div class="lbl">今日已花</div></div>
        <div class="budget-stat"><div class="val">${todayRecords.length}</div><div class="lbl">笔数</div></div>
        <div class="budget-stat"><div class="val">?${weekTotal.toFixed(1)}</div><div class="lbl">本周累计</div></div>
        <div class="budget-stat"><div class="val">?${monthTotal.toFixed(1)}</div><div class="lbl">本月累计</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">??</span>记一笔</div>
      </div>
      <div class="budget-input-row">
        <select id="budget-category" class="budget-select">
          <option value="餐饮">? 餐饮</option>
          <option value="交通">? 交通</option>
          <option value="买菜">? 买菜</option>
          <option value="购物">?? 购物</option>
          <option value="咖啡">? 咖啡</option>
          <option value="零食">? 零食</option>
          <option value="日用">? 日用</option>
          <option value="其他">? 其他</option>
        </select>
        <input id="budget-amount" type="number" step="0.1" placeholder="金额" class="budget-amount-input">
        <input id="budget-note" placeholder="备注（选填）" class="budget-note-input">
        <button class="btn btn-primary budget-add-btn" onclick="addBudgetRecord()">? 记账</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">?</span>今日明细</div>
        <div class="card-actions"><span style="font-size:12px;color:var(--text-light)">共${todayRecords.length}笔 · ?${todayTotal.toFixed(1)}</span></div>
      </div>
      ${todayRecords.length === 0 ? `
        <div style="text-align:center;padding:30px;color:var(--text-light)">
          <div style="font-size:32px;margin-bottom:8px">?</div>
          <div style="font-size:13px">今天还没记账，记第一笔吧～</div>
        </div>
      ` : todayRecords.map((r, i) => `
        <div class="budget-record-item">
          <span class="budget-record-cat">${r.category}</span>
          <span class="budget-record-note">${r.note ? escapeHtml(r.note) : ''}</span>
          <span class="budget-record-time">${r.time}</span>
          <span class="budget-record-amount">-?${r.amount.toFixed(1)}</span>
          <button class="budget-record-del" onclick="deleteBudgetRecord('${today}', ${i})">?</button>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">?</span>历史记录（最近7天）</div>
      </div>
      ${historyDates.length === 0 ? `<div style="text-align:center;padding:20px;color:var(--text-light);font-size:13px">暂无历史记录</div>` : historyDates.map(d => {
        const records = data[d] || [];
        const total = records.reduce((s, r) => s + r.amount, 0);
        const remain = DAILY_BUDGET - total;
        const dayOver = total > DAILY_BUDGET;
        const dayDate = new Date(d);
        const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
        return `
          <div class="budget-history-item">
            <div class="budget-history-date">
              <span style="font-weight:600">${formatDateCN(d)}</span>
              <span style="font-size:11px;color:var(--text-light);margin-left:6px">${dayNames[dayDate.getDay()]}</span>
              <span style="font-size:11px;color:var(--text-light);margin-left:6px">${records.length}笔</span>
            </div>
            <div class="budget-history-amount">
              <span style="color:var(--text);font-weight:600">?${total.toFixed(1)}</span>
              <span class="budget-history-status ${dayOver ? 'over' : 'ok'}">${dayOver ? `超支 ?${Math.abs(remain).toFixed(1)}` : `结余 ?${remain.toFixed(1)}`}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="emoji">?</span>记账说明</div>
      </div>
      <div style="font-size:13px;line-height:1.9;color:var(--text-light)">
        <p>? 每日预算：<strong>?${DAILY_BUDGET}</strong></p>
        <p>? 每天记录支出后，自动计算当天总和与剩余</p>
        <p>? 今日预算含昨日结余（或扣除昨日超支），滚动计算</p>
        <p>? 超出预算显示红色，有结余显示绿色</p>
        <p>? 数据存在手机本地，不会丢失</p>
      </div>
    </div>
  `;
}

function addBudgetRecord() {
  const category = document.getElementById('budget-category').value;
  const amount = parseFloat(document.getElementById('budget-amount').value);
  const note = document.getElementById('budget-note').value.trim();
  if (!amount || amount <= 0) { showToast('?? 请输入有效金额'); return; }
  const data = getBudgetData();
  const today = getTodayStr();
  if (!data[today]) data[today] = [];
  const now = new Date();
  data[today].push({ category, amount, note, time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  saveBudgetData(data);
  showToast(`? 已记账 ?${amount.toFixed(1)}`);
  render();
}
function deleteBudgetRecord(date, index) {
  const data = getBudgetData();
  if (data[date]) { data[date].splice(index, 1); if (data[date].length === 0) delete data[date]; saveBudgetData(data); showToast('?? 已删除'); render(); }
}

        <div class="gift-input-row">

          <input id="gift-amount" type="number" step="100" placeholder="金额（元）" class="gift-amount-input">

            <div class="gift-record-date">${g.date || '未填日期'}</div>
          </div>

        </div>

    <div class="card">
      <div class="card-header"><div class="card-title"><span class="emoji">?</span>使用说明</div></div>

function addGiftRecord() {
  const type = document.getElementById('gift-type').value;
  const amount = parseFloat(document.getElementById('gift-amount').value);
  const name = document.getElementById('gift-name').value.trim();
  const event = document.getElementById('gift-event').value.trim();
  const date = document.getElementById('gift-date').value;
  if (!amount || amount <= 0) { showToast('?? 请输入金额'); return; }
  if (!name) { showToast('?? 请输入对方姓名'); return; }
  const gifts = getGiftData();
  const now = new Date();
  gifts.push({ id: 'g' + Date.now(), type, amount, name, event, date: date || getTodayStr(), time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}` });
  saveGiftData(gifts);
  showToast(`? 已记录 ${type} ?${amount.toFixed(0)}`);
  render();
}
function deleteGiftRecord(id) {
  const gifts = getGiftData();
  const index = gifts.findIndex(g => g.id === id);
  if (index >= 0) { gifts.splice(index, 1); saveGiftData(gifts); showToast('?? 已删除'); render(); }
}

/* ---------- 待办状态本地存储 ---------- */
function getTodoDoneState() {
  try {
    const saved = JSON.parse(localStorage.getItem('zhouping_todos') || '{}');
    if (saved.date !== getTodayStr()) return {};
    return saved.done || {};
  } catch(e) { return {}; }
}
function saveTodoDoneState(doneMap) { localStorage.setItem('zhouping_todos', JSON.stringify({ date: getTodayStr(), done: doneMap })); }
function restoreTodoState() {
  const doneMap = getTodoDoneState();
  WORKBENCH_DATA.todos.forEach(t => { t.done = !!doneMap[t.id]; });
}

/* ---------- 交互逻辑 ---------- */
let currentTab = 'overview';
function switchTab(tabId) { currentTab = tabId; render(); }
function toggleTodo(id) {
  const todo = WORKBENCH_DATA.todos.find(t => t.id === id);
  if (todo) {
    todo.done = !todo.done;
    const doneMap = {};
    WORKBENCH_DATA.todos.forEach(t => { if (t.done) doneMap[t.id] = true; });
    saveTodoDoneState(doneMap);
    render();
    if (todo.done) showToast('? 完成一项！继续加油');
  }
}
function toggleRecipe(i) { const cards = document.querySelectorAll('.recipe-card'); if (cards[i]) cards[i].classList.toggle('expanded'); }
function completeRun() {
  if (WORKBENCH_DATA.run.today < WORKBENCH_DATA.run.target) {
    WORKBENCH_DATA.run.today = WORKBENCH_DATA.run.target;
    WORKBENCH_DATA.run.streak += 1;
    render();
    showToast('? 跑步打卡完成！真棒');
  } else { showToast('今日已完成打卡'); }
}
function refreshHot() { showToast('? 热点每小时更新，请稍后刷新'); }
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2500);
}

/* ---------- 主渲染 ---------- */
function render() {
  const content = {
    overview: renderOverview,
    douyin: renderDouyin,
    accounts: renderAccounts,
    todo: renderTodo,
    recipe: renderRecipe,
    running: renderRunning,
    notes: renderNotes,
    budget: renderBudget,
    gift: renderGift,
  };
  app.innerHTML = renderTopbar() + `<div class="layout">` + renderNav(currentTab) + `<div class="main"><div class="tab-content active">${content[currentTab]()}</div></div></div>`;
}

/* ---------- 时钟 ---------- */
function updateClock() {
  const el = document.getElementById('current-time');
  if (el) { const now = new Date(); el.textContent = now.toTimeString().slice(0, 5); }
}

/* ---------- 启动 ---------- */
restoreTodoState();
render();
setInterval(updateClock, 60000);

</script>
</body>
</html>
